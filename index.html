<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>app</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Pacifico&family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&family=Quicksand:wght@400;700&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
</head>
<body data-frame="image" data-decor="plants">
    <div class="app">
        <img src="./assets/lilplant.png" class="plant-top">

        <button id="settings-btn" title="Personalizar">⚙</button>

        <div class="title" id="title"><span id="title-text">Gui's Calendar</span></div>

        <div id="calendar">
            <div id="day"></div>
            <div id="month"></div>
        </div>

        <img src="./assets/plant_1.gif" class="plant left">
        <img src="./assets/plant_2.gif" class="plant center">
        <img src="./assets/plant_3.gif" class="plant right">

        <img class="sticker tr" alt="">
        <img class="sticker bl" alt="">
        <img class="sticker bc" alt="">
        <img class="sticker br" alt="">
    </div>

    <script src="settings-shared.js"></script>
    <script src="script.js"></script>
</body>
</html>
